<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspect360</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head><body>
<p id="st" style="font-family:sans-serif;text-align:center;margin-top:40px">Chargement Inspect360…</p>
<script>
(async function(){
  const n = 6;
  let b64 = '';
  for(let i=0;i<n;i++){
    const r = await fetch('chunk_'+i+'.txt?t='+Date.now());
    if(!r.ok){document.getElementById('st').textContent='Erreur chunk '+i;return}
    b64 += await r.text();
  }
  const html = decodeURIComponent(escape(atob(b64)));
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body></html>
